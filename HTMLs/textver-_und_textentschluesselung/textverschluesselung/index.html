<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textverschlüsselung</title>
    <script>
        if (window.matchMedia("(min-width: 750px)").matches) {
            window.open('https://cdn.jsdelivr.net/gh/User92736/alles-von-mir@main/zu-kleiner-bildschirm.txt');
        }
    </script>
    <link rel="icon" href="https://images.squarespace-cdn.com/content/v1/5ef2ceb8ea30127cb1f46c43/393fda61-7564-4875-af5c-48ca4393a235/2001978.png">
    <style>
        body {
            background-color: #0011ff;
        }
        header {
            background-color: #001195;
            font-family: 'Open Sans', sans-serif;
            color: white;
            padding: 16px 100px;
            font-size: 24px;
            position: fixed;
            left: 0;
            right: 0;
            top: 0;
        }
        textarea {
            position: absolute;
            color: white;
            font-family: 'Open Sans', sans-serif;
            background-color: #2f3dff;
            border: white solid;
            padding: 8px;
            font-size: large;
            height: 300px;
            width: 1000px;
            top: 200px;
            left: 100px;
        }
        textarea::placeholder {
            color: white;
            font-size: large;
        }
        p {
            position: absolute;
            color: white;
            font-family: 'Open Sans', sans-serif;
            font-weight: bold;
            top: 160px;
            left: 100px;
        }
        button {
            position: absolute;
            background-color: red;
            color: black;
            font-size: large;
            font-weight: bold;
            border: none;
            top: 100px;
            left: 100px;
            height: 40px;
            width: 200px;
        }
        button:hover {
            background-color: rgb(197, 0, 0);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>Textverschlüsselung</header>
    <div class="container">
        <textarea id="textarea" placeholder="Zu verschlüsselnder Text hier eingeben" type="text"></textarea>
        <p id="p">0 Zeichen</p>
        <button id="button">Verschlüsseln</button>
    </div>
    <script>
        let textzumverschluesseln = "";
        textarea.addEventListener('input', () => {
            p.innerHTML = textarea.value.length + " Zeichen";
            textzumverschluesseln = textarea.value;
        });
        function downloadTxtFile(filename, text) {
            const blob = new Blob([text], {type: "text/plain;charset=utf-8"});
            const fileURL = URL.createObjectURL(blob);
            const element = document.createElement("a");
            element.href = fileURL;
            element.download = filename + ".txt";
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
            URL.revokeObjectURL(fileURL);
        }
        const randomKeyZeichen = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789§°+*ç%&/()=?^!¨äöüèéà-_.:,;<>{}[]@|~€$ ";
        function zeichenzuzahl(zeichen) {
            return randomKeyZeichen.indexOf(zeichen);
        }
        function zahlzuzeichen(zahl) {
            return randomKeyZeichen[zahl];
        }
        function textVerschluesselnunddownloaden() {
            const randomKeyArray = Array.from({length: textzumverschluesseln.length}, () => randomKeyZeichen[Math.floor(Math.random() * randomKeyZeichen.length)]);
            let verschluesselterText = "";
            const laenge = randomKeyZeichen.length;
            for (let i = 0; i < textzumverschluesseln.length; i++) {
                const keyIndex = zeichenzuzahl(randomKeyArray[i]);
                const textIndex = zeichenzuzahl(textzumverschluesseln[i]);
                if (textIndex === -1) {
                    verschluesselterText += textzumverschluesseln[i];
                    randomKeyArray[i] = textzumverschluesseln[i];
                    continue;
                }
                const neuerIndex = (keyIndex + textIndex) % laenge;
                verschluesselterText += zahlzuzeichen(neuerIndex);
            }
            downloadTxtFile("Key", randomKeyArray.join(""));
            downloadTxtFile("Verschluesselter_Text", verschluesselterText);
        }
        button.addEventListener('click', () => {
            if(confirm("Sicher das du den Text verschlüsseln willst?")) {
                if (!textzumverschluesseln) {
                    alert("Gib zuerst einen Text zum verschlüsseln ein!")
                } else {
                    textVerschluesselnunddownloaden();
                }
            }
        });
    </script>
</body>
</html>
